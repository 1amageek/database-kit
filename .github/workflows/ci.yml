name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAINS: org.swift.64202607231a
  SWIFT_SNAPSHOT: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a
  SWIFT_SNAPSHOT_URL: https://download.swift.org/swift-6.4.x-branch/xcode/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a-osx.pkg
  XCODE_TEST_RESULT_DIRECTORY: /tmp/database-kit-xcode-results

jobs:
  native:
    name: Native contract (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install verification tools
        run: brew install ripgrep

      - name: Install pinned Swift toolchain
        run: |
          toolchain_package="$RUNNER_TEMP/${SWIFT_SNAPSHOT}-osx.pkg"
          toolchain_root="$HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain"
          curl -fL --retry 3 -o "$toolchain_package" "$SWIFT_SNAPSHOT_URL"
          installer -pkg "$toolchain_package" -target CurrentUserHomeDirectory
          test -x "$toolchain_root/usr/bin/swift"
          echo "$toolchain_root/usr/bin" >> "$GITHUB_PATH"

      - name: Report Swift version
        run: |
          swift --version
          xcrun --toolchain "$TOOLCHAINS" swiftc --version

      - name: Test native contract
        timeout-minutes: 30
        run: scripts/xcode-test-harness

      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-xcresults
          path: /tmp/database-kit-xcode-results
          if-no-files-found: error
